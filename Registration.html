<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crescent Youth – Membership Registration</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            padding: 35px;
            border-radius: 14px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        h2 {
            text-align: center;
            margin-bottom: 8px;
            color: #123524;
        }

        .subtitle {
            text-align: center;
            font-size: 14px;
            color: #666;
            margin-bottom: 22px;
            line-height: 1.5;
        }

        label {
            font-size: 13px;
            color: #444;
            font-weight: bold;
            margin-top: 10px;
            display: block;
        }

        input, select, textarea {
            width: 100%;
            padding: 11px;
            margin: 7px 0 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }

        textarea {
            resize: vertical;
            min-height: 70px;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #2e7d32;
        }

        .checkbox-group {
            margin-top: 12px;
        }

        .checkbox-group label {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            font-weight: normal;
            font-size: 13px;
            line-height: 1.4;
        }

        .checkbox-group input {
            width: auto;
            margin-top: 2px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            background: #2e7d32;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1b5e20;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        #loading {
            text-align: center;
            margin-top: 15px;
            color: #555;
            display: none;
            font-size: 14px;
        }

        .note {
            font-size: 13px;
            color: #777;
            text-align: center;
            margin-top: 15px;
            line-height: 1.5;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Join Crescent Youth</h2>
    <p class="subtitle">
        Become a member of Crescent Youth and support our youth activities, events and community projects.
    </p>

    <form id="form">

        <label>First Name</label>
        <input type="text" name="firstName" required>

        <label>Last Name</label>
        <input type="text" name="lastName" required>

        <label>Email Address</label>
        <input type="email" name="email" required>

        <label>Phone Number</label>
        <input type="tel" name="phone" required>

        <label>Date of Birth</label>
        <input type="date" name="dateOfBirth" required>

        <label>Gender</label>
        <select name="gender" required>
            <option value="">Select Gender</option>
            <option>Male</option>
            <option>Female</option>
            <option>Prefer not to say</option>
        </select>

        <label>Membership Type</label>
        <select name="membership" required>
            <option value="">Select Membership Type</option>
            <option>Youth Member (€10/year)</option>
            <option>Volunteer (Free)</option>
        </select>

        <label>Emergency Contact Name</label>
        <input type="text" name="emergencyName" required>

        <label>Emergency Contact Phone</label>
        <input type="tel" name="emergencyPhone" required>

        <label>Interests / Activities</label>
        <textarea name="interests"></textarea>

        <div class="checkbox-group">
            <label>
                <input type="checkbox" name="gdprConsent" value="Yes" required>
                I agree that Crescent Youth may store my personal data.
            </label>

            <label>
                <input type="checkbox" name="termsConsent" value="Yes" required>
                I agree to follow the rules and values of Crescent Youth.
            </label>

            <label>
                <input type="checkbox" name="photoConsent" value="Yes">
                I allow photos/videos to be used.
            </label>
        </div>

        <button type="submit" id="submitBtn">Proceed to Payment</button>

    </form>

    <p id="loading">Processing... Please wait</p>

    <p class="note">
        After payment, please include your full name and email in the payment remark.
    </p>
</div>

<script>
    const scriptURL = "https://script.google.com/macros/s/AKfycbxO0sCiecYXgQeiwGZ8ForOnsaDwmni37gyeBABuk1xmNT4cr0sSByOYikT_Tku8c8Txg/exec";
    const sumUpLink = "https://pay.sumup.com/b2c/QEK4YNPB";

    const form = document.getElementById("form");
    const loading = document.getElementById("loading");
    const submitBtn = document.getElementById("submitBtn");

    form.addEventListener("submit", e => {
        e.preventDefault();

        loading.style.display = "block";
        submitBtn.disabled = true;
        submitBtn.textContent = "Processing...";

        fetch(scriptURL, {
            method: "POST",
            mode: "no-cors",   // 🔥 IMPORTANT FIX
            body: new FormData(form)
        })
            .then(() => {
                window.location.href = sumUpLink;
            })
            .catch(() => {
                alert("Something went wrong. Please try again.");
                loading.style.display = "none";
                submitBtn.disabled = false;
                submitBtn.textContent = "Proceed to Payment";
            });
    });
</script>

</body>
</html>
